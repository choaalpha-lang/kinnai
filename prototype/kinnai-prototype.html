}

.badge.green{background:var(--green-soft);color:var(--green)}

.skel{height:118px;border-radius:var(--r);background:linear-gradient(90deg,var(--line) 25%,var(--paper) 50%,var(--line) 75%);background-size:200% 100%;animation:sh 1.1s linear infinite}

.tty{font-size:40px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--green)}

.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.bar>b{display:block;height:100%;background:var(--coral);border-radius:9px;transition:width .3s}
.bar.green>b{background:var(--green)}
.input{border:1px solid var(--line);background:var(--paper);border-radius:11px;padding:9px 12px;width:100%}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}

.console{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h3{font-size:14px}
.panel .hint{color:var(--muted);font-size:12.5px;margin:0}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.meter{display:flex;flex-direction:column;gap:5px;min-width:0}
.meter .num{font-size:30px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.meter small{color:var(--muted)}
.cov{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:6px 18px;font-size:13px}
.cov li{display:flex;gap:8px;align-items:baseline}
.cov code{font-family:var(--mono);font-size:12px;font-weight:600;flex:none}
.cov .dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--line);align-self:center}
.cov li.done .dot{background:var(--green)}
.cov li span.t{color:var(--muted)}
.cov li.done span.t{color:var(--ink)}
.log{background:var(--log-bg);color:var(--log-fg);border-radius:12px;padding:12px 14px;font-family:var(--mono);font-size:12px;line-height:1.7;max-height:250px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.log .d{color:var(--log-dim)}
.log .n{color:var(--mango)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.panel ul.plain{margin:0;padding-left:18px;font-size:13px;display:flex;flex-direction:column;gap:4px}
@media (max-width:900px){
  .cols{grid-template-columns:minmax(0,1fr)}
  .phone{position:static;height:auto;min-height:640px;border-width:0;border-radius:22px;border:1px solid var(--line);max-width:460px;width:100%;margin:0 auto}
  .screen{overflow:visible}
}
.cd{font-weight:700;font-variant-numeric:tabular-nums;color:var(--coral)}
.ktab{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.ktab div{background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.ktab b{font-size:22px;line-height:1.2;font-variant-numeric:tabular-nums}
.ktab small{color:var(--muted);font-size:11.5px}
.povbar{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--mango-soft);color:var(--mango-text);border-radius:10px;padding:6px 10px;font-size:11.5px}
.sp{height:2px}
</style>

function search(reroll){
  touch();if(!S.tc){S.tc=Date.now();ev('criteria_completed',{session:'s'+S.sid,budget:P.bud,cuisine:P.cui,radius_km:P.rad,is_first_in_session:true})}cov['SOLO-001']=1;S.note=null;S.screen='loading';
  ev(reroll?'shortlist_rerolled':'recommendation_requested',{budget:P.bud,cuisine:P.cui,radius_km:P.rad,location:S.loc==='granted'?'device':S.area});
  var sid=S.sid;render();
  setTimeout(function(){
    if(sid!==S.sid||S.screen!=='loading')return;
    if(S.scenario==='error'){S.screen='error';ev('recommendation_failed',{reason:'provider_timeout'});return render()}
    var all=candidates(),pool=all.filter(function(r){return S.seen.indexOf(r.id)<0});
    if(!pool.length&&all.length){S.seen=[];pool=all;S.note=L('ดูครบทุกร้านที่ตรงเงื่อนไขแล้ว วนกลับมาชุดแรก','You have seen every match. Showing the first set again.')}
    var list=pool.slice(0,3);
    if(S.scenario==='few')list=list.slice(0,1);
    if(S.scenario==='none')list=[];
    S.list=list;list.forEach(function(r){S.seen.push(r.id)});
    S.screen='results';cov['SOLO-002']=1;
    ev('shortlist_shown',{count:list.length,ids:list.map(function(r){return r.id})});render();
  },S.scenario==='slow'?2800:650);
}
function mapUrl(r,area){var a=by(AREAS,area||S.area||'asok');return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(cu(r.c).en+' restaurant near '+a.en+' Bangkok')}

/* ---------- kampai logic (organizer) ---------- */
function kMembers(){return 1+K.joined}
function kVoted(){return Object.keys(K.votes).length+(K.mine?1:0)}
function kShort(){var b=by(BUD,K.bud),resp=FRIENDS.slice(0,K.opened).filter(function(f){return !f.silent&&!f.ghost});
  return R.filter(function(r){return r.p<=b.max&&r.d<=3}).map(function(r){var m=(K.my.indexOf(r.c)>=0||K.my.indexOf(r.c2)>=0?1:0);resp.forEach(function(f){if(f.likes.indexOf(r.c)>=0||f.likes.indexOf(r.c2)>=0)m++});return {r:r,m:m}}).sort(function(a,b){return b.m-a.m||b.r.s-a.r.s}).slice(0,4)}
function kTally(){var t={};K.short.forEach(function(x){t[x.r.id]=0});Object.keys(K.votes).forEach(function(k){t[K.votes[k]]++});if(K.mine)t[K.mine]++;return t}
function kClose(by_){
  var t=kTally(),max=-1,tied=[];K.short.forEach(function(x){var v=t[x.r.id];if(v>max){max=v;tied=[x.r.id]}else if(v===max)tied.push(x.r.id)});
  K.tie=tied.length>1;K.tied=tied;K.winner=K.tie?null:tied[0];K.abst=kMembers()-kVoted();K.step=3;K.noResult=false;
  ev('group_vote_closed',{group_id:'g'+K.run.toFixed(0).slice(-4),votes:t,tie:K.tie,abstained:K.abst,closed_by:by_});
  if(K.tie){K.tieDeadline=Date.now()+FIVE;K.remind=true;ev('group_tie_reminder_shown',{group_id:'g'+K.run.toFixed(0).slice(-4)})}
}
function kSchedule(){var run=K.run;FRIENDS.slice(0,K.opened).forEach(function(f,i){if(f.silent||f.ghost)return;setTimeout(function(){if(K.run!==run||K.step!==2)return;var pick=K.short[0].r.id;for(var j=0;j<K.short.length;j++){var r=K.short[j].r;if(f.likes.indexOf(r.c)>=0||f.likes.indexOf(r.c2)>=0){pick=r.id;break}}K.votes[f.n]=pick;ev('group_vote_cast',{member:'synthetic_'+(i+1),is_change:false});render()},900*(i+1))})}
function kJoin(){var run=K.run;FRIENDS.forEach(function(f,i){setTimeout(function(){if(K.run!==run)return;K.opened=Math.max(K.opened,i+1);M.opened++;ev('group_link_opened',{member_pseudo_id:'m'+(i+1),is_new_pseudo_id:true,is_existing_kinnai_user:false,in_app_browser:S.inApp});
  if(!f.ghost){K.joined++;M.joined++;ev('group_joined',{member_pseudo_id:'m'+(i+1)});if(!f.silent){K.answered++;ev('group_preference_set',{member_pseudo_id:'m'+(i+1),cuisine_count:f.likes.length})}}
  if(K.step===1&&!S.pov)render();M.dirty=1},700*(i+1))})}

  }

  h+='<section class="panel"><h3>จำลองสถานการณ์</h3><span class="label">เปิดแอปจาก</span>'+seg('app',[['web','เบราว์เซอร์ปกติ'],['line','LINE in-app browser']],S.inApp?'line':'web')+'<span class="label">ผลการค้นหา (แท็บ กินไหน)</span>'+seg('scn',[['normal','ปกติ'],['slow','เน็ตช้า'],['few','เจอร้านเดียว'],['none','ไม่เจอร้าน'],['error','ระบบค้นหาล่ม']],S.scenario)+'<span class="label">สิทธิ์ตำแหน่ง (แท็บ กินไหน)</span>'+seg('loc',[['granted','อนุญาต'],['denied','ผู้ใช้ปฏิเสธ']],S.loc)+'<span class="label">ทางลัดเวลา (ต้นแบบเท่านั้น)</span><div class="chips"><button class="chip" data-act="povstart">ดูมุมมองเพื่อนที่เปิดลิงก์</button><button class="chip" data-act="skipvote">ข้ามเวลาโหวต 5 นาที</button><button class="chip" data-act="skiptie">ข้ามเวลารอผู้จัด 5 นาที</button><button class="chip" data-act="rstdismiss">ล้างการกด "ไว้ทีหลัง"</button></div></section>';
  h+=kPanel();
  h+='<section class="panel"><h3>Requirement ที่ลองแล้วในรอบนี้</h3><ul class="cov">'+REQ.map(function(r){return '<li class="'+(cov[r[0]]?'done':'')+'"><span class="dot"></span><code>'+r[0]+'</code><span class="t">'+r[1]+'</span></li>'}).join('')+'</ul></section>';
  h+='<section class="panel"><h3>Analytics events (จำลอง)</h3><div class="log">'+(log.length?log.map(function(e){return '<span class="d">+'+e.t+'s</span> <span class="n">'+e.n+'</span> <span class="d">'+esc(e.p)+'</span>'}).join('\n'):'<span class="d">ยังไม่มี event เริ่มใช้แอปด้านซ้ายเพื่อดู event ที่จะส่งเข้า PostHog</span>')+'</div></section>';
  h+='<div class="two"><section class="panel"><h3>Founder ตัดสินแล้ว</h3><ul class="plain"><li>Kampai-first (D-016)</li><li>ผู้ร่วมกลุ่มไม่ต้อง login ผู้จัดและ Solo ขอ login หลังตัดสินใจ ข้ามได้ (D-017)</li><li>เสมอ: ผู้จัดเลือก ถ้าไม่เลือกใน 5 นาทีกลุ่มปิดโดยไม่มีผลและโหวตใหม่ได้ (D-003, D-023)</li><li>ไม่ตอบ = งดออกเสียง (D-004)</li><li>งบเป็นเพดาน (D-002)</li><li>ถอด Plus, Kampai Premium, referral (D-018)</li><li>ใช้ชุดสีเดิมของแอป</li><li>PDPA ตามกฎหมาย (D-005)</li></ul></section><section class="panel"><h3>ยังเปิดอยู่</h3><ul class="plain"><li>Places provider: รอ API key เพื่อทดสอบข้อมูลจริง</li><li>ย่านเปิดตัว และเครือข่ายผู้ทดสอบ</li><li>Supabase region</li><li>จะขออีเมลจาก Apple/Google หรือไม่</li><li>ใช้โลโก้ K + Fork หรือโลโก้เดิม</li></ul></section><section class="panel"><h3>ไม่อยู่ในต้นแบบนี้</h3><ul class="plain"><li>ข้อมูลร้านจริง GPS จริง และ backend</li><li>ลิงก์และ realtime จริง (เพื่อนเป็นข้อมูลจำลอง)</li><li>login จริงกับ Apple และ Google</li><li>การเตือนผู้จัดนอกหน้าจอ (ไม่มี push ใน MVP1)</li><li>Intent Exchange, Workplace, การชำระเงิน</li><li>การแนะนำด้วย LLM</li></ul></section></div>';
  document.getElementById('console').innerHTML=h;tick()}
function tick(){
  var now=Date.now();
  if(!S.pov&&K.step===2&&K.deadline&&now>=K.deadline&&!K.closing){
    if(kVoted()>=2){K.closing=1;cov['GRP-005']=1;kClose('deadline');K.closing=0;render();return}
    else if(!K.dlWarn){K.dlWarn=true;ev('group_deadline_reached_below_quorum',{voices:kVoted()});render();return}
  }
  if(K.step===3&&K.tie&&!K.winner&&!K.noResult&&K.tieDeadline&&now>=K.tieDeadline){K.noResult=true;cov['GRP-005']=1;ev('group_closed_no_result',{group_id:'g'+K.run.toFixed(0).slice(-4),reason:'tie_unresolved'});render();return}
  var cv=document.getElementById('cdVote');if(cv)cv.textContent=mmss(Math.max(0,K.deadline-now));
  var ct=document.getElementById('cdTie');if(ct)ct.textContent=mmss(Math.max(0,K.tieDeadline-now));
  var a=document.getElementById('soloT');if(!a)return;
  var s=S.decision?S.decision.tty:S.tc?now-S.tc:0,g=K.tty!=null?K.tty:K.t0?now-K.t0:0;
  a.textContent=fmt(s)+' วิ';a.style.color=s>30000?'var(--coral)':'';
  var sb=document.getElementById('soloB');sb.style.width=Math.min(100,s/300)+'%';sb.style.background=s>30000?'var(--coral)':'';
  var b=document.getElementById('grpT');b.textContent=mmss(g);b.style.color=g>300000?'var(--coral)':'';
  var gb=document.getElementById('grpB');gb.style.width=Math.min(100,g/3000)+'%';gb.style.background=g>300000?'var(--coral)':'';
  var ge=document.getElementById('grpE');if(ge){var e2=K.e2e!=null?K.e2e:K.tc0?now-K.tc0:0;ge.textContent='นับจากสร้างกลุ่ม: '+mmss(e2)}
  if(M.dirty){M.dirty=0;renderConsole()}}
function render(){renderApp();renderConsole()}

/* ---------- actions ---------- */
function abandon(){if(S.t0&&!S.decision){ev('session_abandoned',{session:'s'+S.sid,at_screen:S.screen})}}
function copy(text,done){var ok=L('คัดลอกแล้ว','Copied'),no=L('คัดลอกอัตโนมัติไม่ได้: ','Could not copy automatically: ')+text;try{navigator.clipboard.writeText(text).then(function(){done(ok)},function(){done(no)})}catch(e){done(no)}}
function gid(){return 'g'+K.run.toFixed(0).slice(-4)}
var A={
  lang:function(v){P.lang=v;save()},
  tab:function(v){S.tab=v;S.confirmDel=false;S.meOffer=false},
  bud:function(v){touch();P.bud=v;save();ev('preference_set',{budget:v})},
  cui:function(v){touch();P.cui=v;save();ev('preference_set',{cuisine:v})},
  rad:function(v){touch();P.rad=+v;save();ev('preference_set',{radius_km:+v})},
  area:function(v){touch();S.area=v;ev('area_selected',{area:v})},
  go:function(){S.seen=[];search(false);return false},
  reroll:function(){search(true);return false},
  home:function(){S.screen='home'},
  relax:function(){var i=RAD.indexOf(P.rad);if(i<RAD.length-1)P.rad=RAD[i+1];else P.cui='any';if(S.scenario==='none'||S.scenario==='few')S.scenario='normal';save();ev('filters_relaxed',{radius_km:P.rad,cuisine:P.cui});S.seen=[];search(false);return false},
  pick:function(v){
    if(S.decision){ev('decision_confirmed',{ignored:'duplicate',decision_id:S.decision.id});return}
    var tty=Date.now()-S.tc;S.decision={id:'d'+S.sid,rid:+v,tty:tty};S.fb=null;S.fbr=null;S.screen='done';cov['SOLO-003']=1;
    P.hist.unshift({rid:+v,tty:tty});P.hist=P.hist.slice(0,10);save();
    ev('decision_confirmed',{decision_id:'d'+S.sid,restaurant:+v,time_to_yes_ms:tty,within_target:tty<=30000})},
  dup:function(){ev('decision_confirmed',{ignored:'duplicate',decision_id:S.decision.id})},
  map:function(){cov['SOLO-004']=1;ev('map_opened',{decision_id:S.decision.id,provider:'google_maps'})},
  fb:function(v){var id=S.decision.rid;S.fb=v;S.fbr=null;cov['SOLO-005']=1;P.liked=P.liked.filter(function(x){return x!==id});P.disliked=P.disliked.filter(function(x){return x!==id});(v==='up'?P.liked:P.disliked).push(id);save();ev('feedback_submitted',{decision_id:S.decision.id,rating:v})},
  fbr:function(v){S.fbr=v;ev('feedback_reason',{decision_id:S.decision.id,reason:v})},
  'new':function(){abandon();S.t0=null;S.tc=null;S.decision=null;S.list=[];S.seen=[];S.screen='home';S.fb=null},
  del1:function(){S.confirmDel=true},del0:function(){S.confirmDel=false},
  del2:function(){try{localStorage.removeItem(KEY)}catch(e){}var lang=P.lang;P={lang:lang,auth:null,authDismissedAt:null,bud:'b2',cui:'any',rad:2,liked:[],disliked:[],hist:[],groups:[]};S.confirmDel=false;ev('account_deleted',{scope:'account,preferences,history,groups'})},
  /* login offer */
  offerauth:function(v){S.offer={step:v,msg:null};ev('auth_method_selected',{method:v})},
  authok:function(){var m=S.offer.step;P.auth={ids:[m]};S.offer={step:null,msg:null};S.justSaved=true;S.meOffer=false;cov['AUTH-001']=1;save();ev('auth_completed',{method:m,is_new_user:true,taps:2})},
  authno:function(){ev('auth_cancelled',{method:S.offer.step});S.offer={step:null,msg:L('ยังไม่ได้เข้าสู่ระบบ ลองอีกครั้งหรือข้ามได้ ผลที่ได้ไม่เปลี่ยน','Not signed in yet. Try again or skip. Your result is unchanged.')}},
  authlater:function(){P.authDismissedAt=Date.now();save();S.offer={step:null,msg:null};ev('auth_dismissed',{trigger:S.offerKey?S.offerKey.split(':')[0]:'unknown'})},
  openext:function(){ev('auth_open_external',{from:'in_app_browser'});S.inApp=false;S.offer={step:null,msg:L('เปิดในเบราว์เซอร์ใหม่แล้ว (จำลอง) เบราว์เซอร์ใหม่เป็น session ใหม่ ข้อมูลที่ทำไว้ในหน้าเดิมไม่ตามไป','Opened in a new browser (simulated). It is a new session, so what you did before does not follow.')}},
  signin:function(){S.meOffer=true;S.offer={step:null,msg:null}},
  link:function(v){P.auth.ids.push(v);save();ev('identity_linked',{method:v})},
  unlink:function(v){if(P.auth.ids.length<2)return;P.auth.ids=P.auth.ids.filter(function(x){return x!==v});save();ev('identity_unlinked',{method:v})},
  signout:function(){P.auth=null;S.justSaved=false;save();ev('signed_out')},
  rstdismiss:function(){P.authDismissedAt=null;save()},
  scn:function(v){S.scenario=v},
  loc:function(v){S.loc=v;if(v==='granted')S.area=null;ev('location_permission',{status:v})},
  app:function(v){S.inApp=(v==='line');ev('sim_open_from',{in_app_browser:S.inApp})},
  /* organizer */
  kbud:function(v){K.bud=v},karea:function(v){K.area=v},
  kcreate:function(){K.step=1;K.tc0=Date.now();M.groups++;if(K.src)M.newOrg++;cov['ANL-002']=1;ev('group_created',{group_id:gid(),budget:K.bud,area:K.area,source_group_id:K.src,organizer_logged_in:!!P.auth});kJoin()},
  kcopy:function(){copy('kinnai.example/k/7QF2',function(m){K.copy=m;render()});ev('group_invite_shared',{group_id:gid(),channel:'copy_link'})},
  kshare:function(){var done=function(m){K.copy=m;render()};if(navigator.share){navigator.share({title:K.name,url:'https://kinnai.example/k/7QF2'}).then(function(){done(L('แชร์แล้ว','Shared'))},function(){done(L('ยกเลิกการแชร์','Share cancelled'))});ev('group_invite_shared',{group_id:gid(),channel:'web_share'})}else{copy('kinnai.example/k/7QF2',done);ev('group_invite_shared',{group_id:gid(),channel:'copy_link'})}},
  kstart:function(){K.copy=null;K.t0=Date.now();K.deadline=K.t0+FIVE;K.short=kShort();K.step=2;K.votes={};K.mine=null;K.dlWarn=false;ev('group_decision_start',{group_id:gid(),members:kMembers()});ev('group_shortlist_shown',{group_id:gid(),count:K.short.length,latency_ms:420});kSchedule()},
  kmy:function(v){var i=K.my.indexOf(v);if(i>=0)K.my.splice(i,1);else K.my.push(v)},
  kvote:function(v){var ch=!!K.mine;K.mine=+v;ev('group_vote_cast',{group_id:gid(),member:'organizer',is_change:ch})},
  kclose:function(){if(kVoted()<2)return;kClose('organizer')},
  kpick:function(v){K.winner=+v;K.tieDeadline=null;ev('group_tie_broken',{group_id:gid(),by:'organizer'})},
  kback:function(){K.step=2;K.votes={};K.mine=null;K.winner=null;K.tie=false;K.noResult=false;K.dlWarn=false;K.remind=false;K.tieDeadline=null;K.deadline=Date.now()+FIVE;K.run=K.run;ev('group_vote_restarted',{group_id:gid()});kSchedule()},
  kconfirm:function(){var n=Date.now();K.tty=n-K.t0;K.e2e=n-K.tc0;K.step=4;cov['GRP-002']=1;P.groups.unshift({name:K.name,rid:K.winner,tty:K.tty});P.groups=P.groups.slice(0,10);save();ev('group_decision_confirmed',{group_id:gid(),time_to_yes_ms:K.tty,within_5min:K.tty<=FIVE,abstained:K.abst,tie_broken_by_organizer:K.tie})},
  kmap:function(){cov['SOLO-004']=1;ev('map_opened',{group_id:gid(),provider:'google_maps'})},
  kcopy2:function(){var w=by(R,K.winner);cov['GRP-004']=1;ev('group_result_shared',{group_id:gid(),channel:'copy'});copy(K.name+' → '+nm(w)+' ('+nm(by(AREAS,K.area))+') ฿'+w.p+L('/คน','/person'),function(m){K.copy=m;render()})},
  kreset:function(){if(K.step<4)ev('group_cancelled',{group_id:gid(),at_step:K.step,elapsed_ms:K.t0?Date.now()-K.t0:0});S.fromPov=false;K=newK()},
  skipvote:function(){if(K.step===2)K.deadline=Date.now()-1},
  skiptie:function(){if(K.step===3&&K.tie&&!K.winner)K.tieDeadline=Date.now()-1},
  /* participant view */
  povstart:function(){if(S.pov)return;S.pov=true;PV=newPV();M.groups++;M.opened++;ev('group_link_opened',{group_id:'g_pov',member_pseudo_id:'me',is_new_pseudo_id:true,in_app_browser:S.inApp});M.dirty=1},
  pexit:function(){S.pov=false;PV=null},
  pjoin:function(){var n=document.getElementById('pnick');PV.nick=n?n.value:'';PV.step=1;PV.taps++;M.joined++;cov['GRP-003']=1;ev('group_joined',{group_id:'g_pov',member_pseudo_id:'me',has_nickname:!!PV.nick});M.dirty=1},
  pcui:function(v){var i=PV.my.indexOf(v);if(i>=0)PV.my.splice(i,1);else if(PV.my.length<2)PV.my.push(v);PV.taps++},
  pvote:function(v){PV.vote=+v;PV.taps++;ev('group_preference_set',{group_id:'g_pov',cuisine_count:PV.my.length});ev('group_vote_cast',{group_id:'g_pov',member_pseudo_id:'me',is_change:false,taps_since_open:PV.taps});PV.step=2;var run=PV.run;setTimeout(function(){if(!S.pov||!PV||PV.run!==run)return;var t=pvTally(),max=-1,tied=[];PVG.ids.forEach(function(id){if(t[id]>max){max=t[id];tied=[id]}else if(t[id]===max)tied.push(id)});PV.tiebreak=tied.length>1;tied.sort(function(a,b){return by(R,b).s-by(R,a).s});PV.result=tied[0];PV.step=3;ev('group_decision_confirmed',{group_id:'g_pov',viewer:'participant'});render()},2500);M.dirty=1},
  pmap:function(){ev('map_opened',{group_id:'g_pov',provider:'google_maps'})},
  pshare:function(){cov['GRP-004']=1;ev('group_result_shared',{group_id:'g_pov',channel:'copy'});copy('kinnai.example/k/7QF2',function(){})},
  pcta:function(){cov['GRP-004']=1;M.cta++;ev('group_cta_create_clicked',{group_id:'g_pov',source_group_id:'g_pov'});S.pov=false;PV=null;S.fromPov=true;S.tab='kampai';K=newK();M.dirty=1}
};
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  var r=A[b.dataset.act](b.dataset.v);
  if(r===false)return;
  if(b.tagName==='A')setTimeout(render,80);else render();
});
document.addEventListener('input',function(e){if(e.target.id==='kname')K.name=e.target.value;if(e.target.id==='pnick'&&PV)PV.nick=e.target.value});
setInterval(tick,100);
render();
})();
